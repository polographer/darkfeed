id: io.github.polographer.darkfeed
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: darkfeed
command-environment:
  LD_LIBRARY_PATH: /app/lib
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
finish-args-add-default: false

modules:
  - name: darkfeed
    buildsystem: simple
    build-commands: []
    sources:
      # Copy pre-built Flutter Linux bundle into the Flatpak build dir
      - type: script
        scripts:
          - |
            mkdir -p bundle
            cp -a "$FLATPAK_BUNDLE_DIR/." bundle/
        dest: bundle

      # Desktop entry
      - type: file
        path: io.github.polographer.darkfeed.desktop

      # AppStream metadata
      - type: file
        path: io.github.polographer.darkfeed.metainfo.xml

      # App icons
      - type: directory
        path: icons

    install-commands:
      # Install the Flutter binary
      - install -Dm755 bundle/darkfeed /app/bin/darkfeed
      # Install Flutter engine libraries
      - cp -a bundle/lib /app/
      # Install Flutter assets (next to binary for relative path resolution)
      - cp -a bundle/flutter_assets /app/bin/
      # Desktop entry
      - install -Dm644 io.github.polographer.darkfeed.desktop -t /app/share/applications/
      # AppStream metadata
      - install -Dm644 io.github.polographer.darkfeed.metainfo.xml -t /app/share/metainfo/
      # Icons (all sizes)
      - install -Dm644 icons/128x128/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 icons/256x256/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 icons/512x512/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 icons/1024x1024/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/1024x1024/apps/
      - install -Dm644 icons/metadata.json /app/share/icons/hicolor/metadata.json
