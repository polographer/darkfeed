id: io.github.polographer.darkfeed
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: darkfeed

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: darkfeed
    buildsystem: simple
    build-commands:
      # Copy the Flutter Linux bundle
      - mkdir -p /app/lib/darkfeed
      - cp -a "$FLATPAK_BUNDLE_DIR/." /app/lib/darkfeed/
      # Create wrapper script
      - |
        mkdir -p /app/bin
        printf '%s\n' '#!/bin/bash' 'export LD_LIBRARY_PATH="/app/lib/darkfeed/lib:${LD_LIBRARY_PATH}"' 'exec /app/lib/darkfeed/darkfeed "$@"' > /app/bin/darkfeed
        chmod +x /app/bin/darkfeed
      # Desktop entry
      - install -Dm644 io.github.polographer.darkfeed.desktop -t /app/share/applications/
      # AppStream metadata
      - install -Dm644 io.github.polographer.darkfeed.metainfo.xml -t /app/share/metainfo/
      # Icons (all sizes)
      - install -Dm644 icons/128x128/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 icons/256x256/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 icons/512x512/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 icons/1024x1024/io.github.polographer.darkfeed.png -t /app/share/icons/hicolor/1024x1024/apps/
      - install -Dm644 icons/metadata.json /app/share/icons/hicolor/metadata.json
    sources:
      # Desktop entry
      - type: file
        path: io.github.polographer.darkfeed.desktop
      # AppStream metadata
      - type: file
        path: io.github.polographer.darkfeed.metainfo.xml
      # App icons
      - type: file
        path: icons/128x128/io.github.polographer.darkfeed.png
      - type: file
        path: icons/256x256/io.github.polographer.darkfeed.png
      - type: file
        path: icons/512x512/io.github.polographer.darkfeed.png
      - type: file
        path: icons/1024x1024/io.github.polographer.darkfeed.png
      - type: file
        path: icons/metadata.json
