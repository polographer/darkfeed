app-id: io.github.polographer.darkfeed
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: darkfeed

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: darkfeed
    buildsystem: simple
    build-commands:
      - install -d /app/lib/darkfeed
      - cp -a * /app/lib/darkfeed/
      - |
        install -d /app/bin
        printf '%s\n' '#!/bin/bash' 'export LD_LIBRARY_PATH="/app/lib/darkfeed/lib:${LD_LIBRARY_PATH}"' 'exec /app/lib/darkfeed/darkfeed "$@"' > /app/bin/darkfeed
        chmod +x /app/bin/darkfeed
      - install -Dm644 darkfeed.desktop /app/share/applications/io.github.polographer.darkfeed.desktop
      - install -Dm644 darkfeed.png /app/share/icons/hicolor/256x256/apps/io.github.polographer.darkfeed.png
    sources:
      - type: dir
        path: linux-bundle
      - type: file
        path: appimage/darkfeed.desktop
        dest-filename: darkfeed.desktop
      - type: file
        path: web/icons/circus-negative.png
        dest-filename: darkfeed.png
