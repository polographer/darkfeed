name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Generate coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-darkfeed
          fail_ci_if_error: false
        continue-on-error: true

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run integration tests
        run: flutter test test/integration/

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate coverage
        run: flutter test --coverage

      - name: Check coverage thresholds
        run: |
          echo "Checking overall app coverage..."
          
          # Calculate total coverage across all files
          TOTAL_LINES_FOUND=$(grep -E "^LF:" coverage/lcov.info | cut -d: -f2 | awk '{sum+=$1} END {print sum}')
          TOTAL_LINES_HIT=$(grep -E "^LH:" coverage/lcov.info | cut -d: -f2 | awk '{sum+=$1} END {print sum}')
          
          # Calculate coverage percentage
          COVERAGE=$(echo "scale=2; ($TOTAL_LINES_HIT / $TOTAL_LINES_FOUND) * 100" | bc)
          
          echo "Overall App Coverage: $COVERAGE% ($TOTAL_LINES_HIT/$TOTAL_LINES_FOUND lines)"
          
          # Check if coverage meets threshold (45%)
          if (( $(echo "$COVERAGE >= 45" | bc -l) )); then
            echo "✅ Coverage meets threshold (45%)"
            exit 0
          else
            echo "❌ Coverage below threshold: $COVERAGE% < 45%"
            exit 1
          fi
