name: Build and Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write  # Required to upload assets to releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag or input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
          else
            # Extract from pubspec.yaml
            VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          echo "Running tests before building..."
          flutter test
          echo "All tests passed!"

      - name: Build macOS app
        run: |
          set -e
          flutter build macos --release --verbose 2>&1 | tail -50
          echo "Build output:"
          ls -la build/macos/build/Release/ 2>/dev/null || echo "Release dir not found"
          ls -la build/macos/Build/Products/Release/ 2>/dev/null || echo "Build/Products/Release not found"

      - name: Create macOS archive
        id: archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH=$(uname -m)
          
          # Find the .app bundle (may be in different locations on x64 vs ARM64)
          APP_DIR=""
          if [ -d "build/macos/build/Release" ]; then
            APP_DIR="build/macos/build/Release"
          elif [ -d "build/macos/Build/Products/Release" ]; then
            APP_DIR="build/macos/Build/Products/Release"
          fi
          
          if [ -z "$APP_DIR" ] || [ -z "$(ls -d $APP_DIR/*.app 2>/dev/null)" ]; then
            echo "ERROR: No .app bundle found in expected locations"
            echo "build/macos/build/Release exists: $([ -d build/macos/build/Release ] && echo yes || echo no)"
            echo "build/macos/Build/Products/Release exists: $([ -d build/macos/Build/Products/Release ] && echo yes || echo no)"
            echo "Contents of build/macos/build/:"
            ls -la build/macos/build/ 2>/dev/null || true
            exit 1
          fi
          
          ARCHIVE_NAME="darkfeed-${VERSION}-macos-${ARCH}"
          
          # Create output directory
          mkdir -p release-output
          
          # Copy the app bundle
          cp -R "$APP_DIR"/*.app release-output/
          
          # Create compressed archive
          ditto -c -k --keepParent release-output/*.app "${ARCHIVE_NAME}.zip"
          
          echo "Created archive: ${ARCHIVE_NAME}.zip"
          ls -lh "${ARCHIVE_NAME}.zip"
          
          # Export for downstream steps
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "archive_file=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT

      - name: Upload macOS build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkfeed-${{ steps.version.outputs.version }}-macos-${{ steps.archive.outputs.archive_name && 'macos-' }}${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          path: ${{ steps.archive.outputs.archive_file }}
          if-no-files-found: error

      - name: Upload macOS build to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.archive.outputs.archive_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        if: github.event_name == 'release'
        run: |
          ARCHIVE_NAME="${{ steps.archive.outputs.archive_name }}.zip"
          hash=$(shasum -a 256 "$ARCHIVE_NAME" | awk '{print $1}')
          echo "${hash}  ${ARCHIVE_NAME}" > checksums.txt
          cat checksums.txt

      - name: Upload checksums to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
