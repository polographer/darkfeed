  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required to upload assets to releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version from tag or input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
          else
            # Extract from pubspec.yaml
            VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install Android SDK & accept licenses
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Run tests
        run: |
          echo "Running tests before building..."
          flutter test
          echo "All tests passed!"
      
      - name: Build Android APK
        run: flutter build apk --release
      
      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkfeed-${{ steps.version.outputs.version }}-android.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      
      - name: Upload APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate checksums
        if: github.event_name == 'release'
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > checksums.txt
          cat checksums.txt
      
      - name: Upload checksums to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
