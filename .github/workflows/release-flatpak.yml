name: Build Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  APP_ID: io.github.polographer.darkfeed

jobs:
  # ── x86_64 Build ──────────────────────────────────────────────
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: stable
          cache: true

      - name: Install Flatpak SDK (x86_64)
        run: |
          flatpak install --user -y flathub org.gnome.Sdk org.gnome.Platform 47 || true

      - name: Build Flutter Linux (x86_64)
        run: |
          flutter pub get
          flutter build linux --release

      - name: Prepare bundle directory
        run: |
          cp -r build/linux/x64/release/bundle build-flatpak-x86_64

      - name: Build Flatpak bundle (x86_64)
        run: |
          flatpak-builder --force-clean --arch=x86_64 --user \
            --env=FLATPAK_BUNDLE_DIR=$(pwd)/build-flatpak-x86_64 \
            build-dir-x64 flatpak/${{ env.APP_ID }}.yml
          flatpak build-bundle --user build-dir-x64 \
            ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-x86_64.flatpak \
            ${{ env.APP_ID }}

      - name: Upload x86_64 Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-x86_64.flatpak
          path: ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-x86_64.flatpak

      - name: Upload to release (x86_64)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── ARM64 Build ───────────────────────────────────────────────
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: master
          cache: true

      - name: Install Flatpak SDK (ARM64)
        run: |
          flatpak install --user -y flathub org.gnome.Sdk org.gnome.Platform 47 || true

      - name: Build Flutter Linux (ARM64)
        run: |
          flutter pub get
          flutter build linux --release

      - name: Prepare bundle directory
        run: |
          cp -r build/linux/arm64/release/bundle build-flatpak-aarch64

      - name: Build Flatpak bundle (ARM64)
        run: |
          flatpak-builder --force-clean --arch=aarch64 --user \
            --env=FLATPAK_BUNDLE_DIR=$(pwd)/build-flatpak-aarch64 \
            build-dir-aarch64 flatpak/${{ env.APP_ID }}.yml
          flatpak build-bundle --user build-dir-aarch64 \
            ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-aarch64.flatpak \
            ${{ env.APP_ID }}

      - name: Upload ARM64 Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-aarch64.flatpak
          path: ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-aarch64.flatpak

      - name: Upload to release (ARM64)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.APP_ID }}-${{ steps.version.outputs.version }}-aarch64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Checksums ─────────────────────────────────────────────────
  checksums:
    needs: [build-x64, build-aarch64]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all Flatpak artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_ID }}-*-*.flatpak
          path: flatpaks/

      - name: Generate checksums
        run: |
          cd flatpaks
          sha256sum *.flatpak > checksums.txt
          cat checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v1
        with:
          files: flatpaks/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
